owner: callumrowe
repo: deck-uptime

# Every site on the cjhr.dev stack, checked every five minutes from GitHub
# Actions, *off* the Hetzner box. Everything else watching the stack (Deck's
# signals worker and error reporter, the server's own server-health check) runs
# on the host it is watching, so a dead host produces no alert, just silence.
# This is the only signal whose absence cannot be mistaken for good news.
#
# Where an app has a real health endpoint (one that touches its database) we
# check that rather than the homepage: Deck's `/healthz` runs `select 1` against
# Postgres, Ki's and FTC's `/health` and Plausible's `/api/health` likewise
# return 200 only when the app is actually serving. Single-page apps answer 200
# for any path, so for those the homepage is the honest check. Deck keeps the
# name "Deck" so its history (history/deck.yml) carries on.
sites:
  - name: Deck
    url: https://deck.cjhr.dev/healthz
  - name: Ki
    url: https://ki.cjhr.dev/health
  - name: Sweat
    url: https://sweat.cjhr.dev
  - name: FTC
    url: https://ftc.cjhr.dev/health
  - name: Casebook
    url: https://casebook.cjhr.dev/login
  - name: Feel
    url: https://feel.cjhr.dev
  - name: Sulky Kiwi
    url: https://sulkykiwi.cjhr.dev
  - name: Sulky Kiwi API
    url: https://sulkykiwi-api.cjhr.dev
  - name: Tiny Generals
    url: https://tinygenerals.cjhr.dev
  - name: Margeapalooza
    url: https://margeapalooza.cjhr.dev
  - name: Oskar's Missions
    url: https://oskarsmissions.cjhr.dev
  - name: Our Wedding
    url: https://ourwedding.cjhr.dev
  - name: Beyond Earth tools
    url: https://beyondearth-tools.cjhr.dev
  - name: Diagrams
    url: https://diagrams.callums.work
  - name: callums.work
    url: https://callums.work
  - name: becky.design
    url: https://becky.design
  - name: Flight website
    url: https://getflightbrowser.com
  - name: Analytics (Plausible)
    url: https://analytics.cjhr.dev/api/health

# Downtime opens an issue in this repository; it closes itself on recovery.
assignees:
  - callumrowe

status-website:
  # Served by GitHub Pages, off the Hetzner box, on purpose: a status page
  # hosted on the infrastructure it reports on goes down with it. The DNS is a
  # CNAME to callumrowe.github.io, deliberately not an A record to the server
  # and deliberately not proxied — GitHub issues its own certificate and cannot
  # validate through Cloudflare's proxy.
  #
  # Upptime writes the CNAME file on gh-pages from this value, so it must stay
  # in step with the custom domain configured on the repository's Pages
  # settings; the site build overwrites that branch on every run.
  cname: status.cjhr.dev
  name: cjhr.dev Status
  introTitle: "**cjhr.dev** — live status"
  introMessage: Every app on the cjhr.dev stack, checked every five minutes from GitHub Actions, outside the server they run on. Outages open an [issue](https://github.com/callumrowe/deck-uptime/issues) and post to Slack.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Values passed through to the workflows from repository secrets.
# NOTIFICATION_SLACK is the literal string "true"; the webhook URL points at
# the stack-wide #uptime channel (renamed from #deck-uptime; the webhook survives),
# kept separate from the sync, infra, backups and error channels so an outage
# is never buried in, or muted with, anything else.
secrets:
  - NOTIFICATION_SLACK
  - NOTIFICATION_SLACK_WEBHOOK_URL
